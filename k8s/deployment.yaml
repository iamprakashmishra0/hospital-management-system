---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hms-config
data:
  DATABASE_TYPE: "sqlite"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: hms-secret
type: Opaque
stringData:
  API_KEY: "hms-api-key-change-in-production"
  JWT_SECRET: "hms-jwt-secret-change-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: patient-service:latest
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: patient-data
          mountPath: /app/service_data
      volumes:
      - name: patient-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  type: ClusterIP
  selector:
    app: patient-service
  ports:
  - port: 8001
    targetPort: 8001
