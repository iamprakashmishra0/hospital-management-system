---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hms-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: hms.local
    http:
      paths:
      - path: /patient
        pathType: Prefix
        backend:
          service:
            name: patient-service
            port:
              number: 8001
      - path: /doctor
        pathType: Prefix
        backend:
          service:
            name: doctor-service
            port:
              number: 8002
      - path: /appointment
        pathType: Prefix
        backend:
          service:
            name: appointment-service
            port:
              number: 8003
      - path: /billing
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 8004
      - path: /prescription
        pathType: Prefix
        backend:
          service:
            name: prescription-service
            port:
              number: 8005
      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8006
      - path: /notification
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8007